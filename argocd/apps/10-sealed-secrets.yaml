# Le contrÃ´leur Sealed Secrets, installÃ© par Argo CD depuis un chart Helm (pas de dÃ©pÃ´t Git : source = chart).
# Ã€ dÃ©placer dans argocd/apps/ en partie 3 : git mv argocd/apps-extra/10-sealed-secrets.yaml argocd/apps/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0            # version du chart (contrÃ´leur 0.40.0)
    helm:
      valuesObject:
        fullnameOverride: sealed-secrets-controller   # le nom attendu par dÃ©faut par la CLI kubeseal
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
