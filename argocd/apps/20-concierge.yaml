# Le concierge IA, partagÃ© : un seul Ollama pour dev et prod, dans son propre namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: concierge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # supprimer l'Application supprime aussi ses ressources
spec:
  project: platform
  source:
    repoURL: https://github.com/Roulitau/TP-Argo.git   # Ã€ COMPLÃ‰TER
    targetRevision: HEAD
    path: base/concierge
  destination:
    server: https://kubernetes.default.svc
    namespace: concierge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
